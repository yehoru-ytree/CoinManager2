name: doc-review-routine

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  atlas-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Fire atlas-conformance routine and wait for its verdict
        env:
          ROUTINE_TRIGGER_URL: ${{ secrets.ROUTINE_TRIGGER_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number in context — atlas-conformance-bot needs a PR. Run this from a pull_request." >&2
            exit 1
          fi

          # --- 1. Fire the routine (never echo the response body: an error response
          #        can echo the payload, which carries the PAT). ---
          # NO-TOKEN EXPERIMENT: payload carries only line 1, no GH_TOKEN.
          # The routine must use its connected GitHub integration (MCP) to read/post.
          TEXT="PR #${PR_NUMBER} in ${REPO} (head ${HEAD_SHA})"
          BODY=$(jq -n --arg text "$TEXT" '{text: $text}')

          CODE=$(curl -sS -o /tmp/fire-body.json -w '%{http_code}' -X POST "$ROUTINE_TRIGGER_URL" \
            -H "Authorization: Bearer ${CLAUDE_CODE_OAUTH_TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "fire HTTP ${CODE}"
          test "${CODE}" -ge 200 -a "${CODE}" -lt 300
          SESSION_URL=$(jq -r '.claude_code_session_url // empty' /tmp/fire-body.json)
          rm -f /tmp/fire-body.json
          # Surface the session URL as a run annotation so its token/cost usage is
          # one click away in the Anthropic Console (the routine can't self-report tokens).
          if [ -n "$SESSION_URL" ]; then
            echo "::notice title=atlas-conformance session::$SESSION_URL"
          else
            echo "::warning::fire response had no claude_code_session_url"
          fi

          # --- 2. Poll PR comments up to 5 minutes for the routine's verdict marker
          #        for THIS head_sha: <!-- atlas-gate verdict=<fail|pass|skip> head=<sha> -->
          #        This job's own check IS the gate: in-progress while polling, green on
          #        exit 0, red on exit 1 — no separate commit status needed.
          DEADLINE=$((SECONDS + 300))
          VERDICT=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            VERDICT=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[].body' 2>/dev/null \
              | grep -oE "atlas-gate verdict=[a-z]+ head=$HEAD_SHA" | tail -1 \
              | sed -E 's/.*verdict=([a-z]+).*/\1/' || true)
            [ -n "${VERDICT:-}" ] && break
            sleep 15
          done

          # --- 3. Verdict → job result. ---
          case "$VERDICT" in
            fail)
              echo "::error::atlas-conformance: documentation drift found — see the PR comments"
              exit 1
              ;;
            pass|skip)
              echo "::notice::atlas-conformance: $VERDICT — no blocking findings"
              exit 0
              ;;
            *)
              echo "::warning::atlas-conformance did not respond within 5 minutes — gate skipped (not blocking)"
              gh pr comment "$PR_NUMBER" -R "$REPO" \
                --body "[atlas-conformance-gate] ⏱ Routine did not respond within 5 minutes — gate skipped, merge not blocked.${SESSION_URL:+ Session: $SESSION_URL}"
              exit 0
              ;;
          esac
