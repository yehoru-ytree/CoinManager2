name: doc-review-routine

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  fire-routine:
    runs-on: ubuntu-latest
    steps:
      - name: Fire Claude Code routine
        env:
          ROUTINE_TRIGGER_URL: ${{ secrets.ROUTINE_TRIGGER_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail

          TEXT="Review repository '${REPO}' (ref ${REF}) for documentation compliance.
          Clone/read it with this GitHub token (read access): ${CI_GIT_TOKEN}"

          BODY=$(jq -n --arg text "$TEXT" '{text: $text}')

          HTTP=$(curl -sS -o /tmp/routine-resp.json -w '%{http_code}' -X POST "$ROUTINE_TRIGGER_URL" \
            -H "Authorization: Bearer ${CLAUDE_CODE_OAUTH_TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "HTTP ${HTTP}"
          cat /tmp/routine-resp.json
          echo
          test "${HTTP}" -ge 200 -a "${HTTP}" -lt 300
